{
  "name": "Northstar",
  "options": {
    "bundleIdPrefix": "com.northstar.planner",
    "deploymentTarget": { "iOS": "17.0" },
    "xcodeVersion": "16.0",
    "minimumXcodeGenVersion": "2.42.0",
    "createIntermediateGroups": true
  },
  "settings": {
    "base": {
      "SWIFT_VERSION": "5.0",
      "IPHONEOS_DEPLOYMENT_TARGET": "17.0",
      "MARKETING_VERSION": "0.1.0",
      "CURRENT_PROJECT_VERSION": "1",
      "CODE_SIGN_STYLE": "Automatic",
      "TARGETED_DEVICE_FAMILY": "1",
      "ENABLE_USER_SCRIPT_SANDBOXING": "YES"
    }
  },
  "targets": {
    "Northstar": {
      "type": "application",
      "platform": "iOS",
      "sources": [
        { "path": "Northstar", "excludes": ["Info.plist"] },
        { "path": "Shared" }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.northstar.planner",
          "INFOPLIST_FILE": "Northstar/Info.plist",
          "CODE_SIGN_ENTITLEMENTS": "Config/Northstar.entitlements",
          "SWIFT_OBJC_BRIDGING_HEADER": "Shared/NorthstarFileLock.h",
          "ASSETCATALOG_COMPILER_APPICON_NAME": "AppIcon",
          "ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME": "AccentColor",
          "SUPPORTS_MACCATALYST": "NO"
        }
      },
      "dependencies": [
        { "target": "MonitorExtension", "embed": true },
        { "target": "ShieldConfigurationExtension", "embed": true },
        { "target": "ShieldActionExtension", "embed": true }
      ]
    },
    "MonitorExtension": {
      "type": "app-extension",
      "platform": "iOS",
      "sources": [
        { "path": "MonitorExtension", "excludes": ["Info.plist"] },
        { "path": "Shared" }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.northstar.planner.monitor",
          "INFOPLIST_FILE": "MonitorExtension/Info.plist",
          "CODE_SIGN_ENTITLEMENTS": "Config/MonitorExtension.entitlements",
          "SWIFT_OBJC_BRIDGING_HEADER": "Shared/NorthstarFileLock.h",
          "APPLICATION_EXTENSION_API_ONLY": "YES",
          "SKIP_INSTALL": "YES"
        }
      }
    },
    "ShieldConfigurationExtension": {
      "type": "app-extension",
      "platform": "iOS",
      "sources": [
        { "path": "ShieldConfigurationExtension", "excludes": ["Info.plist"] },
        { "path": "Shared" }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.northstar.planner.shieldconfiguration",
          "INFOPLIST_FILE": "ShieldConfigurationExtension/Info.plist",
          "CODE_SIGN_ENTITLEMENTS": "Config/ShieldConfigurationExtension.entitlements",
          "SWIFT_OBJC_BRIDGING_HEADER": "Shared/NorthstarFileLock.h",
          "APPLICATION_EXTENSION_API_ONLY": "YES",
          "SKIP_INSTALL": "YES"
        }
      }
    },
    "ShieldActionExtension": {
      "type": "app-extension",
      "platform": "iOS",
      "sources": [
        { "path": "ShieldActionExtension", "excludes": ["Info.plist"] },
        { "path": "Shared" }
      ],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.northstar.planner.shieldaction",
          "INFOPLIST_FILE": "ShieldActionExtension/Info.plist",
          "CODE_SIGN_ENTITLEMENTS": "Config/ShieldActionExtension.entitlements",
          "SWIFT_OBJC_BRIDGING_HEADER": "Shared/NorthstarFileLock.h",
          "APPLICATION_EXTENSION_API_ONLY": "YES",
          "SKIP_INSTALL": "YES"
        }
      }
    },
    "NorthstarTests": {
      "type": "bundle.unit-test",
      "platform": "iOS",
      "sources": [{ "path": "NorthstarTests" }],
      "settings": {
        "base": {
          "PRODUCT_BUNDLE_IDENTIFIER": "com.northstar.planner.tests",
          "GENERATE_INFOPLIST_FILE": "YES"
        }
      },
      "dependencies": [{ "target": "Northstar" }]
    }
  },
  "schemes": {
    "Northstar": {
      "build": {
        "targets": {
          "Northstar": "all",
          "MonitorExtension": "all",
          "ShieldConfigurationExtension": "all",
          "ShieldActionExtension": "all",
          "NorthstarTests": ["test"]
        }
      },
      "run": { "config": "Debug" },
      "test": {
        "config": "Debug",
        "targets": [{ "name": "NorthstarTests", "parallelizable": false }]
      },
      "profile": { "config": "Release" },
      "analyze": { "config": "Debug" },
      "archive": { "config": "Release" }
    }
  }
}
