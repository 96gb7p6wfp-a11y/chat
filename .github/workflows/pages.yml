name: Publish Northstar planning prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: northstar-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the iPhone planning prototype
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Read the configured GitHub Pages path
        id: pages
        uses: actions/configure-pages@v5
      - name: Install frozen dependencies
        run: npm ci --no-audit --no-fund
      - name: Run planning and timer tests
        run: npm test
      - name: Build for the configured Pages address
        env:
          NORTHSTAR_BASE_PATH: '${{ steps.pages.outputs.base_path }}/'
        run: npm run build
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish the HTTPS site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
